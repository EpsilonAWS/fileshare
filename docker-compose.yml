version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ephemera
      POSTGRES_PASSWORD: ephemerapassword
      POSTGRES_DB: ephemera
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephemera -d ephemera"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ephemera:ephemerapassword@db:5432/ephemera
      - BASE_URL=http://localhost:4000
      - STORAGE_MODE=local
      - SECRET_KEY=ephemera-production-docker-secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage

volumes:
  postgres_data:
  backend_storage:
